name: build-check
# Safe, build-only dry run of the release SDK build. Mirrors the `publish_sdk`
# job in release.yml but DOES NOT publish anything (no npm/PyPI/NuGet, no GH release).
# Use it to confirm the SDK build + codegen are clean in CI before cutting a tag.
on:
  push:
    branches:
      - jill/build-check
jobs:
  build_sdk:
    name: Build SDKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goversion }}

      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: pulumi/pulumictl

      - name: Install pulumi
        uses: pulumi/actions@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeversion }}

      - name: Setup DotNet
        uses: actions/setup-dotnet@v4
        with:
          # NOTE: keeps the same key as release.yml (which has a `dotnetverson`
          # typo) so this build behaves identically to the real release job.
          dotnet-version: ${{ matrix.dotnetverson }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pythonversion }}

      - name: Build SDK
        run: make build_${{ matrix.language }}

      # Same exclusions as the real release worktree-clean check, so this surfaces
      # any NEW codegen diffs (e.g. the broken import paths) without publishing.
      - name: Check worktree clean
        run: |
          git update-index -q --refresh
          if ! git diff-files --quiet \
            ':(exclude)provider/cmd/pulumi-resource-onepassword/schema.json' \
            ':(exclude)sdk/nodejs/getItem.ts' \
            ':(exclude)sdk/nodejs/getVault.ts'; then
              >&2 echo "error: working tree is not clean, aborting!"
              git status
              git diff
              exit 1
          fi

    strategy:
      fail-fast: false
      matrix:
        dotnetversion:
          - 3.1.301
        goversion:
          - 1.21.x
        language:
          - nodejs
          - python
          - dotnet
          - go
        nodeversion:
          - 20.x
        pythonversion:
          - "3.9"
