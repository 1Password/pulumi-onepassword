name: upgrade_provider

on:
  workflow_dispatch:
  schedule:
    # https://crontab.guru/#00_07_*_*_MON = "At 07:00 (UTC) on Monday."
    - cron: 00 07 * * MON

permissions:
  contents: read

jobs:
  upgrade_provider:
    name: upgrade_provider
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Call upgrade provider action
        uses: pulumi/pulumi-upgrade-provider-action@12996503de2aaddd72c7426efc43331a8970894f # v0.0.19
        with:
          go-version-file: provider/go.mod
        env:
          GH_TOKEN: ${{ secrets.PULUMI_1P_UPGRADE_PROVIDER_GH_TOKEN }}
