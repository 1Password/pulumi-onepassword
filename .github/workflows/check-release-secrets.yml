name: check-release-secrets
# THROWAWAY: checks that the release secrets still authenticate, WITHOUT
# publishing anything. Delete this file (close the PR unmerged) once done.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm:
    name: NPM_TOKEN
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # `whoami` only proves the token authenticates; compare the user against
      # the package's read-write collaborators to confirm it can publish.
      - name: Check token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN is empty"; exit 1; fi
          # Same check without the npm CLI or .npmrc, to rule out a client config issue.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $NODE_AUTH_TOKEN" https://registry.npmjs.org/-/whoami)
          echo "GET registry.npmjs.org/-/whoami (curl) -> HTTP $status"
          user=$(npm whoami) || { echo "::error::NPM_TOKEN rejected by npm (expired or revoked)"; exit 1; }
          echo "Token authenticates as: $user"
          echo "Collaborators on @1password/pulumi-onepassword:"
          npm access list collaborators @1password/pulumi-onepassword

  pypi:
    name: PYPI_API_TOKEN
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Re-upload the already-published 1.1.3 sdist, byte for byte. PyPI checks
      # auth and project permission first, then treats an identical file as a
      # no-op, so this cannot publish anything:
      #   200 (twine exits 0)       -> token is valid; identical file, nothing written
      #   400 "File already exists" -> token is valid; same name, different hash
      #   403                       -> token is invalid or lacks permission
      - name: Check token
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          SDIST_SHA256: 2ebbefa9463d8a9c6faf65491cad418c186d3a604360e78eaa319ef09c2478ba
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then echo "::error::PYPI_API_TOKEN is empty"; exit 1; fi
          python3 -m pip install --quiet twine
          mkdir dist
          curl -fsSL -o dist/pulumi_onepassword-1.1.3.tar.gz \
            https://files.pythonhosted.org/packages/2d/e3/15ba07147bf1ad602cd6234bb5ff09c29f9206d5ee0bf6845657c593264a/pulumi_onepassword-1.1.3.tar.gz
          # Must match what PyPI already has, or the upload is not a no-op.
          echo "$SDIST_SHA256  dist/pulumi_onepassword-1.1.3.tar.gz" | sha256sum -c -
          rc=0
          out=$(python3 -m twine upload --non-interactive --disable-progress-bar dist/* 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "PYPI_API_TOKEN is valid: PyPI accepted the identical file as a no-op (HTTP 200)"
          elif echo "$out" | grep -q "File already exists"; then
            echo "PYPI_API_TOKEN is valid: PyPI rejected the duplicate filename (HTTP 400)"
          else
            echo "::error::PYPI_API_TOKEN did not authenticate (see response above)"
            exit 1
          fi

  github:
    name: PULUMI_1P_UPGRADE_PROVIDER_GH_TOKEN
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check token
        env:
          GH_TOKEN: ${{ secrets.PULUMI_1P_UPGRADE_PROVIDER_GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::PULUMI_1P_UPGRADE_PROVIDER_GH_TOKEN is empty"; exit 1; fi
          status=$(curl -sS -o user.json -D headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user)
          echo "GET /user -> HTTP $status"
          grep -iE '^(x-oauth-scopes|github-authentication-token-expiration):' headers.txt || true
          if [ "$status" != "200" ]; then
            echo "::error::token rejected by GitHub (expired or revoked)"
            exit 1
          fi
          echo "Token belongs to: $(jq -r .login user.json)"
          # The same call the upgrade_provider job fails on.
          gh release list --repo 1Password/terraform-provider-onepassword --limit 1
