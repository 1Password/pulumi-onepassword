version: "2"
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - lll
    - staticcheck
    - misspell
    - nakedret
    - revive
    - unconvert
    - unused
  exclusions:
    paths:
      - schema.go
      - pulumiManifest.go
formatters:
  enable:
    - gofmt
